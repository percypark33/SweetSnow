<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table — the family food magazine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Karla:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf6ec; --paper: #fffdf8; --ink: #2b2118; --muted: #7a6a58; --line: #eadfcd;
      --tomato: #d9542b; --olive: #6b7a2a; --saffron: #e3a21a; --plum: #7d3c6b; --sea: #2f6f7e; --radius: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #1b1611; --paper: #241d16; --ink: #f4ead9; --muted: #bba98f; --line: #3a2f24; }
    }
    :root[data-theme="dark"] { --bg: #1b1611; --paper: #241d16; --ink: #f4ead9; --muted: #bba98f; --line: #3a2f24; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 Karla, -apple-system, system-ui, sans-serif; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 60px; }
    .mast { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding: 18px 0 10px; margin-bottom: 24px; }
    .mast .name { font: 800 1.8rem Fraunces, Georgia, serif; letter-spacing: -.02em; }
    .mast .issue { font-size: .8rem; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
    h1, h2, h3 { font-family: Fraunces, Georgia, serif; letter-spacing: -.01em; }
    .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; align-items: center; margin-bottom: 30px; }
    .hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.02; margin: 0 0 12px; font-weight: 800; }
    .hero p { color: var(--muted); font-size: 1.1rem; margin: 0; }
    .plate { aspect-ratio: 1; border-radius: 50%; background: var(--paper); border: 10px solid var(--line); position: relative; box-shadow: 0 20px 40px rgba(60,40,10,.12); display: grid; place-items: center; }
    .plate .food { position: absolute; font-size: 3.2rem; }
    .plate .label { font: 600 1rem Fraunces, serif; text-align: center; max-width: 60%; }
    .eaters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
    .eater { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: 600 .9rem Karla, sans-serif; cursor: pointer; }
    .eater.on { background: var(--ink); color: var(--bg); }
    .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 34px; }
    .dish { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; position: relative; overflow: hidden; }
    .dish::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--c); }
    .dish .slot { font-size: .75rem; text-transform: uppercase; letter-spacing: .16em; color: var(--c); font-weight: 600; }
    .dish h3 { font-size: 1.35rem; margin: 4px 0 8px; line-height: 1.15; }
    .dish .emo { font-size: 1.8rem; letter-spacing: 4px; }
    .dish .meta { font-size: .85rem; color: var(--muted); }
    .dish .notes { font-size: .85rem; margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
    .btn { padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); font: 600 .9rem Karla, sans-serif; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn.ghost { background: transparent; color: var(--ink); }
    .section-title { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--ink); padding-top: 10px; margin: 10px 0 16px; }
    .section-title h2 { margin: 0; font-size: 1.7rem; }
    .section-title span { font-size: .8rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
    .spread { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--paper); margin-bottom: 34px; }
    .stat { padding: 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .stat .em { font-size: 1.8rem; }
    .stat .amt { font: 800 1.6rem Fraunces, serif; line-height: 1.1; margin: 6px 0 2px; color: var(--c); }
    .stat .what { font-weight: 600; }
    .stat .tip { font-size: .85rem; color: var(--muted); margin-top: 6px; }
    .cols { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .story { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
    .story h3 { font-size: 1.4rem; margin: 0 0 6px; }
    .story .drop::first-letter { font: 800 3.2rem/0.8 Fraunces, serif; float: left; margin: 6px 8px 0 0; color: var(--tomato); }
    .shelf { display: flex; flex-wrap: wrap; gap: 6px; }
    .jar { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-size: .85rem; cursor: pointer; color: var(--ink); font-family: inherit; }
    .jar.on { background: var(--olive); border-color: var(--olive); color: #fff; }
    .side h3 { font-size: 1.2rem; margin: 0 0 8px; }
    .side ul { padding-left: 18px; margin: 0; font-size: .92rem; }
    .muted { color: var(--muted); }
    .demo { font-size: .8rem; color: var(--muted); font-style: italic; }
    @media (max-width: 820px) { .hero, .cols { grid-template-columns: 1fr; } .plate { width: min(300px, 80vw); margin: 0 auto; } .plate .food { font-size: 2.4rem; } .section-title { flex-wrap: wrap; gap: 4px 12px; } }
  </style>
</head>

  <div class="wrap" id="app"></div>
  <script>
/*
 * Family Health Guide — knowledge base.
 *
 * Everything the guide "knows" lives here as plain data, so it can be reviewed,
 * corrected and extended without touching the engine. Guidance is general and
 * drawn from mainstream sources (Dietary Guidelines for Americans, AHA, ADA,
 * DASH, NKF, FDA food-safety advice). It is not medical advice.
 *
 * Tags connect the pieces: an allergy, condition, diet or medication "blocks"
 * or "cautions" tags, and recipes / emphasised foods carry tags. The engine
 * (engine.js) matches them up.
 */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- allergens
  // Top-9 US allergens. `avoid` = foods to skip, `labelWords` = ingredient-list
  // names that hide the allergen.
  var ALLERGENS = {
    peanut: {
      label: 'Peanut',

      labelWords: ['arachis oil', 'groundnut', 'beer nuts', 'monkey nuts', 'mandelonas', 'hydrolyzed peanut protein']
    },
    treenut: {
      label: 'Tree nuts',
      avoid: ['Almonds, cashews, walnuts, pecans, pistachios, hazelnuts, macadamias, Brazil nuts, pine nuts', 'Nut butters, nut milks & nut oils', 'Pesto, marzipan, praline, nougat, gianduja', 'Many granolas, cereals & baked goods'],
      labelWords: ['marzipan', 'praline', 'nougat', 'gianduja', 'nut meal', 'nut paste', 'pignoli', 'amaretto', 'frangipane']
    },
    milk: {
      label: 'Milk (dairy)',
      avoid: ['Milk, cream, butter, ghee, cheese, yogurt, ice cream', 'Many breads, baked goods & creamy sauces', '"Non-dairy" creamers that contain casein'],

    },
    wheat: {
      label: 'Wheat',
      avoid: ['Bread, pasta, couscous, crackers, most cereals & baked goods', 'Soy sauce (brewed with wheat)', 'Breaded / battered foods, many gravies & sauces'],
      labelWords: ['flour', 'semolina', 'durum', 'spelt', 'farro', 'einkorn', 'kamut', 'farina', 'bulgur', 'seitan', 'triticale', 'graham']
    },
    soy: {
      label: 'Soy',
      avoid: ['Tofu, tempeh, edamame, miso, natto, soy milk', 'Soy sauce, tamari, teriyaki', 'Many processed foods, veggie burgers & protein bars'],

    },
    shellfish: {

    sesame: {
      label: 'Sesame',

  var INTOLERANCES = {

  // --------------------------------------------------------------- conditions
  var CONDITIONS = {
    diabetes2: {

      emphasize: [

    },
    heart: {
      label: 'Heart disease / heart failure',
      group: 'Heart',
      caution: ['high-sodium', 'high-satfat', 'fried'],
      avoid: ['Very salty foods'],
      limit: ['Sodium', 'Saturated fat', 'Alcohol'],
      emphasize: [{ text: 'Mediterranean-style eating: vegetables, legumes, fish, olive oil', tag: 'fish' }],
      tips: ['With heart failure, the care team may also set a fluid limit — follow it.', 'Weigh daily if advised; sudden gain can mean fluid build-up.']
    },
    celiac: {
      label: 'Celiac disease',
      group: 'Digestive',
      block: ['gluten'],
      caution: ['oats'],
      avoid: ['Wheat, barley, rye, triticale, spelt, malt, brewer\'s yeast', 'Regular bread, pasta, beer, most cereals', 'Soy sauce (use certified GF tamari)'],

    },
    ckd: {

      caution: ['high-potassium', 'high-sodium', 'high-phosphorus'],

      limit: ['Sodium', 'Potassium & phosphorus — limits depend on stage and labs', 'Protein amount — set by the care team'],

      group: 'Hormonal',

      avoid: ['Alcohol (no safe amount)', 'High-mercury fish: shark, swordfish, king mackerel, tilefish, bigeye tuna, marlin, orange roughy', 'Raw or undercooked meat, eggs, fish & sprouts', 'Unpasteurized milk, cheese & juice'],

  // ------------------------------------------------------------- medications
  // Matched by keyword against what the user types (brand or generic).
  var MEDICATIONS = [
    {

      tips: ['Keep vitamin K intake CONSISTENT week to week (kale, spinach, broccoli, Brussels sprouts) — don\'t suddenly add or cut them.', 'Limit alcohol; avoid large amounts of cranberry or grapefruit juice.', 'Ask before starting fish oil, vitamin E, ginkgo, turmeric or other supplements.']

    {

    Object.keys(block).forEach(function (t) { delete caution[t]; });

    return {
      who: who,
      age: age,
      band: band,
      block: block,
      caution: caution,
      avoidIngredients: list(member.avoidFoods).filter(Boolean),
      dislikes: list(member.dislikes).filter(Boolean)
    };
  }

  // ---------------------------------------------------------------- targets

  function proteinRDA(age, sex) {
    if (age < 1) return null;
    if (age < 4) return 13;
    if (age < 9) return 19;
    if (age < 14) return 34;
    if (age < 19) return sex === 'male' ? 52 : 46;
    return null;
  }

  function calciumMg(age, sex) {
    if (age < 1) return null;
    if (age < 4) return 700;
    if (age < 9) return 1000;
    if (age < 19) return 1300;
    if (age < 51) return 1000;
    if (age < 71) return sex === 'male' ? 1000 : 1200;
    return 1200;
  }

  function ironMg(age, sex, pregnant) {
    if (age < 1) return null;
    if (pregnant) return 27;
    if (age < 4) return 7;
    if (age < 9) return 10;
    if (age < 14) return 8;
    if (age < 19) return sex === 'male' ? 11 : 15;
    if (age < 51) return sex === 'male' ? 8 : 18;
    return 8;
  }

  function sodiumMg(age) {
    if (age < 1) return null;
    if (age < 4) return 1200;
    if (age < 9) return 1500;
    if (age < 14) return 1800;
    return 2300;
  }

  function fluidsCups(age, sex) {
    if (age < 1) return null;
    if (age < 4) return '4';
    if (age < 9) return '5';
    if (age < 14) return '7–8';
    if (age < 19) return sex === 'male' ? '11' : '8';
    return sex === 'male' ? '13' : (sex === 'female' ? '9' : '9–13');
  }

  function targets(member, rules, today) {
    var age = rules.age;
    if (age === null) return { missing: 'Add a birth date to calculate daily targets.' };
    var sex = member.sex;
    var conds = list(member.conditions);
    var has = function (c) { return conds.indexOf(c) !== -1; };
    var pregnant = has('pregnancy');
    var act = KB.ACTIVITY[member.activity] || KB.ACTIVITY.light;
    var goal = KB.GOALS[member.goal] || KB.GOALS.maintain;
    var weight = currentWeightKg(member);
    var height = member.heightCm ? Number(member.heightCm) : null;
    var t = { notes: [] };
    var focus = Personal.focus(member, age);
    var tweak = Personal.targetTweaks(focus);

    // Calories
    if (member.calorieOverride) {
      t.kcal = Number(member.calorieOverride);
      t.kcalSource = 'Set manually';
    } else if (age < 2) {
      t.kcal = null;
      t.notes.push('Under 2: follow the pediatrician\'s feeding plan rather than a calorie number.');
    } else if (age <= 18) {
      var row = (KB.KID_CALORIES[sex === 'male' ? 'male' : 'female'] || {})[age];
      if (row) {
        t.kcal = row[act.kid];
        t.kcalSource = 'Dietary Guidelines estimate for age ' + age;
      }
      if (goal.kcal) t.notes.push('Kids\' weight goals are best handled with the pediatrician — the calorie estimate isn\'t reduced.');
    } else if (weight && height) {
      var base = 10 * weight + 6.25 * height - 5 * age;
      var bmr = sex === 'male' ? base + 5 : sex === 'female' ? base - 161 : base - 78;
      var kcal = bmr * act.factor + goal.kcal;
      if (goal.kcal < 0) kcal = Math.max(kcal, sex === 'male' ? 1500 : 1200);
      t.kcal = round(kcal, 50);
      t.kcalSource = 'Mifflin-St Jeor × ' + act.label.toLowerCase() + (goal.kcal ? ', ' + goal.label.toLowerCase() : '');
    } else {
      t.kcal = null;
      t.notes.push('Add height and weight to estimate calories.');
    }
    if (pregnant) t.notes.push('Pregnancy: add ~340 kcal/day in the 2nd trimester and ~450 in the 3rd.');
    if (has('breastfeeding')) t.notes.push('Breastfeeding: add ~330–400 kcal/day.');

    // Protein
    if (age >= 19 && weight) {
      var lo = 0.8, hi = 0.8;
      if (age >= 65) { lo = 1.0; hi = 1.2; }
      if (member.goal === 'gain') { lo = 1.2; hi = 1.6; }
      if (pregnant) { lo = Math.max(lo, 1.1); hi = Math.max(hi, 1.1); }
      t.protein = lo === hi ? Math.round(weight * lo) + ' g' : Math.round(weight * lo) + '–' + Math.round(weight * hi) + ' g';
      if (has('ckd')) t.protein += ' (CKD: amount set by care team)';
    } else if (age < 19) {
      var p = proteinRDA(age, sex);
      if (p) t.protein = p + ' g';
    }

    if (t.kcal) {
      t.fiber = Math.round(t.kcal / 1000 * 14) + ' g';
      t.addedSugar = age < 2 ? 'None' : 'under ' + Math.round(t.kcal * (tweak.sugarPct || 0.10) / 4) + ' g';
      var satPct = Math.min((has('cholesterol') || has('heart')) ? 0.06 : 0.10, tweak.satFatPct || 1);
      t.satFat = 'under ' + Math.round(t.kcal * satPct / 9) + ' g';
    }
    var na = sodiumMg(age);
    if (na) {
      if (has('hypertension') || has('heart') || has('ckd')) na = Math.min(na, 1500);
      if (tweak.sodiumMg) na = Math.min(na, tweak.sodiumMg);
      t.sodium = 'under ' + na.toLocaleString('en-US') + ' mg';
    }
    var ca = calciumMg(age, sex);
    if (ca) t.calcium = ca.toLocaleString('en-US') + ' mg';
    var fe = ironMg(age, sex, pregnant);
    if (fe) {
      if (member.diet === 'vegetarian' || member.diet === 'vegan') fe = Math.round(fe * 1.8);
      t.iron = fe + ' mg' + ((member.diet === 'vegetarian' || member.diet === 'vegan') ? ' (plant-based ×1.8)' : '');
    }
    var day = Personal.daily(member, age, focus);
    if (day.water && day.water.cups) t.fluids = day.water.cups + ' cups (' + day.water.liters + ' L) from drinks';
    else if (!day.water) { var cups = fluidsCups(age, sex); if (cups) t.fluids = cups + ' cups'; }
    if (has('heart')) t.notes.push('Heart failure: the care team may set a fluid limit — it overrides the fluids guide.');
    if (has('ckd')) t.notes.push('Kidney disease: fluid, potassium and phosphorus limits come from the care team.');
    return t;
  }

  // ------------------------------------------------------------------ guide

  function buildGuide(member, today) {
    today = today || new Date();
    var rules = profileRules(member, today);
    var age = rules.age;
    var band = rules.band;
    var avoid = newList(), limit = newList(), emphasize = newList();
    var conditionNotes = [], supplements = newList(), alerts = [], labelWords = [], dietTips = [];

    // Allergies
    var allergies = allergyEntries(member);
    allergies.forEach(function (a) {
      var why = a.name + ' allergy';
      if (a.key) {
        var info = KB.ALLERGENS[a.key];
        info.avoid.forEach(function (f) { addItem(avoid, f, why); });
        labelWords.push({ label: info.label, words: info.labelWords, severity: a.severity });
      } else {
        addItem(avoid, a.name, why);
      }
    });
    var severe = allergies.filter(function (a) { return a.severity === 'severe'; });
    if (severe.length) {
      alerts.push({ level: 'danger', text: 'Severe allergy: ' + severe.map(function (a) { return a.name; }).join(', ') + '. Keep epinephrine auto-injectors (if prescribed) on hand and make sure caregivers know the emergency plan.' });
    }

    // Intolerances
    list(member.intolerances).forEach(function (k) {
      var it = KB.INTOLERANCES[k];
      if (!it) return;
      it.limit.forEach(function (f) { addItem(limit, f, it.label); });
      it.emphasize.forEach(function (e) { addItem(emphasize, e.text, it.label, { tag: e.tag }); });
      conditionNotes.push({ title: it.label, tips: it.tips });
    });

    // Conditions
    list(member.conditions).forEach(function (k) {
      var c = KB.CONDITIONS[k];
      if (!c) return;
      c.avoid.forEach(function (f) { addItem(avoid, f, c.label); });
      c.limit.forEach(function (f) { addItem(limit, f, c.label); });
      c.emphasize.forEach(function (e) { addItem(emphasize, e.text, c.label, { tag: e.tag }); });
      conditionNotes.push({ title: c.label, tips: c.tips });
    });
    list(member.otherConditions).forEach(function (oc) {
      if (oc) conditionNotes.push({ title: oc, tips: ['No built-in rules for this condition — add your doctor\'s guidance in "Must avoid" or Notes.'] });
    });

    // Diet & religious rules
    var diet = KB.DIETS[member.diet] || KB.DIETS.omnivore;
    if (member.diet && member.diet !== 'omnivore') {
      list(diet.emphasize).forEach(function (e) { addItem(emphasize, e.text, diet.label + ' diet', { tag: e.tag }); });
      list(diet.supplements).forEach(function (s) { addItem(supplements, s, diet.label + ' diet'); });
      if (diet.tips.length) dietTips.push({ title: diet.label + ' diet', tips: diet.tips });
    }
    list(member.dietRules).forEach(function (k) {
      var r = KB.DIET_RULES[k];
      if (r && r.tips.length) dietTips.push({ title: r.label, tips: r.tips });
    });

    // Medications
    var meds = matchMedications(member.medications);
    meds.forEach(function (m) {
      m.rules.forEach(function (r) {
        list(r.avoidFoods).forEach(function (f) { addItem(avoid, f, m.name); });
        if (r.block && r.block.indexOf('grapefruit') !== -1) addItem(avoid, 'Grapefruit, grapefruit juice, pomelo & Seville orange', m.name);
        if (r.block && r.block.indexOf('alcohol') !== -1) addItem(avoid, 'Alcohol', m.name);
      });
    });

    // Life stage
    if (band) band.avoid.forEach(function (f) { addItem(avoid, f, band.label); });
    if (age !== null && age >= 19 && age < 51 && member.sex === 'female' && list(member.conditions).indexOf('pregnancy') === -1) {
      addItem(supplements, 'Folic acid 400 mcg/day if pregnancy is possible', 'Women of reproductive age');
    }
    if (age !== null && age >= 51) addItem(supplements, 'Vitamin B12 from fortified foods or a supplement', band.label);
    if (age !== null && age >= 65) addItem(supplements, 'Vitamin D — ask about a daily supplement', band.label);
    if (age !== null && age < 1) addItem(supplements, 'Vitamin D drops for breastfed infants (ask the pediatrician)', band.label);
    if (list(member.conditions).indexOf('pregnancy') !== -1) addItem(supplements, 'Prenatal vitamin with folic acid, iron & iodine', 'Pregnancy');

    // Custom rules typed by the family
    var focus = Personal.focus(member, age);
    focus.forEach(function (r) {
      if (!r.lab) return;
      r.eatMore.forEach(function (f) { addItem(emphasize, f, 'Blood test: ' + r.short); });
      r.easyOn.forEach(function (f) { addItem(limit, f, 'Blood test: ' + r.short); });
    });
    list(member.avoidFoods).forEach(function (f) { if (f) addItem(avoid, f, 'Added by family'); });
    list(member.limitFoods).forEach(function (f) { if (f) addItem(limit, f, 'Added by family'); });
    list(member.favoriteFoods).forEach(function (f) { if (f) addItem(emphasize, f, 'Favorite', { favorite: true }); });

    // Emphasised foods that clash with this person's own restrictions.
    emphasize.items.forEach(function (e) {
      if (!e.tag) return;
      // A rule doesn't conflict with its own advice (lactose intolerance → lactose-free milk).
      var others = (rules.caution[e.tag] || []).filter(function (r) { return e.why.indexOf(r) === -1; });
      if (rules.block[e.tag]) e.conflict = 'Not for ' + rules.who + ': ' + rules.block[e.tag].join(', ');
      else if (others.length) e.conflict = 'Check with the care team — also limited for ' + others.join(', ');
    });
    var clashes = emphasize.items.filter(function (e) { return e.conflict && e.conflict.indexOf('Check') === 0; });
    clashes.forEach(function (e) {
      alerts.push({ level: 'warn', text: 'Conflicting advice: "' + e.text + '" is recommended for ' + e.why.join(', ') + ' but limited for another condition. Ask the doctor or dietitian which comes first.' });
    });
    // Remove items from "limit" that are already a full "avoid".
    limit.items = limit.items.filter(function (l) { return !avoid.index[norm(l.text)]; });

    // Measurements → alerts
    var bmi = null, weight = currentWeightKg(member);
    if (age !== null && age >= 20 && weight && member.heightCm) {
      var h = Number(member.heightCm) / 100;
      bmi = Math.round(weight / (h * h) * 10) / 10;
    }
    var sys = latest(member, 'bpSys'), dia = latest(member, 'bpDia');
    if (sys && dia) {
      if (sys.value >= 180 || dia.value >= 120) alerts.push({ level: 'danger', text: 'Last blood pressure ' + sys.value + '/' + dia.value + ' (' + sys.date + ') is in the crisis range. If it is still this high, seek care right away.' });
      else if ((sys.value >= 130 || dia.value >= 80) && list(member.conditions).indexOf('hypertension') === -1) alerts.push({ level: 'warn', text: 'Last blood pressure ' + sys.value + '/' + dia.value + ' is above 130/80. Worth mentioning to the doctor; consider adding "High blood pressure" if diagnosed.' });
    }
    var a1c = latest(member, 'a1c');
    if (a1c) {
      var diab = list(member.conditions).some(function (c) { return c === 'diabetes1' || c === 'diabetes2'; });
      if (!diab && a1c.value >= 6.5) alerts.push({ level: 'warn', text: 'Last A1C ' + a1c.value + '% is in the diabetes range (6.5%+). Discuss with the doctor.' });
      else if (!diab && a1c.value >= 5.7 && list(member.conditions).indexOf('prediabetes') === -1) alerts.push({ level: 'info', text: 'Last A1C ' + a1c.value + '% is in the prediabetes range (5.7–6.4%).' });
    }
    var ldl = latest(member, 'ldl');
    if (ldl && ldl.value >= 160 && list(member.conditions).indexOf('cholesterol') === -1) {
      alerts.push({ level: 'warn', text: 'Last LDL ' + ldl.value + ' mg/dL is high (160+). Discuss with the doctor; consider adding "High cholesterol".' });
    }

    // Unrecognised medications
    var unknownMeds = meds.filter(function (m) { return !m.rules.length; }).map(function (m) { return m.name; });

    // Self-updating reminders
    var reviewed = parseDate(member.reviewedAt);
    if (!reviewed || (today - reviewed) / DAY_MS > 182) {
      alerts.push({ level: 'info', text: reviewed ? 'Profile last reviewed ' + member.reviewedAt + ' — over 6 months ago. Check allergies, medications and conditions are still current.' : 'This profile has not been marked as reviewed yet.' , action: 'review' });
    }
    var hasChronic = list(member.conditions).some(function (c) { return KB.CONDITIONS[c] && KB.CONDITIONS[c].group !== 'Life stage'; });
    var lastLog = list(member.log).map(function (e) { return e.date; }).sort().pop();
    if (hasChronic && (!lastLog || (today - parseDate(lastLog)) / DAY_MS > 365)) {
      alerts.push({ level: 'info', text: lastLog ? 'No measurements logged since ' + lastLog + '. Add recent labs or readings so the guide stays current.' : 'Log blood pressure, weight or lab results to get alerts when numbers change.' });
    }
    var nextBand = nextBandChange(member, today);
    if (nextBand && nextBand.days <= 45) {
      alerts.push({ level: 'info', text: 'On ' + nextBand.date + ' this guide will update automatically to "' + nextBand.band.label + '" guidance.' });
    }

    return {
      member: member,
      today: isoDate(today),
      age: age,
      ageMonths: age !== null && age < 2 ? ageMonths(member.birthdate, today) : null,
      band: band,
      bmi: bmi,
      weightKg: weight,
      alerts: alerts,
      targets: targets(member, rules, today),
      avoid: avoid.items,
      limit: limit.items,
      emphasize: emphasize.items,
      supplements: supplements.items,
      medications: meds,
      unknownMeds: unknownMeds,
      conditionNotes: conditionNotes,
      dietTips: dietTips,
      lifeStageTips: band ? band.tips : [],
      labelWords: labelWords,
      allergies: allergies,
      rules: rules,
      focus: focus,
      daily: Personal.daily(member, age, focus)
    };
  }

  function nextBandChange(member, today) {
    var b = parseDate(member.birthdate);
    var age = ageYears(member.birthdate, today);
    if (!b || age === null) return null;
    var band = ageBand(age);
    var target = band.maxAge;
    if (target >= 200) return null;
    var d = new Date(b.getFullYear() + target, b.getMonth(), b.getDate());
    return { date: isoDate(d), days: Math.ceil((d - today) / DAY_MS), band: ageBand(target) };
  }

  // ----------------------------------------------------------- meal planner

  function recipeTags(recipe) {
    var tags = list(recipe.tags).slice();
    if (tags.indexOf('wheat') !== -1 && tags.indexOf('gluten') === -1) tags.push('gluten');
    var hasMeat = tags.indexOf('meat') !== -1 || tags.indexOf('poultry') !== -1 || tags.indexOf('pork') !== -1;
    if (hasMeat && tags.indexOf('milk') !== -1) tags.push('meat-with-dairy');
    return tags;
  }

  function swapRemoves(swap) {
    var r = list(swap.removes).slice();
    if (r.indexOf('wheat') !== -1 && r.indexOf('gluten') === -1) r.push('gluten');
    if (r.indexOf('milk') !== -1) r.push('meat-with-dairy');
    if (r.indexOf('meat') !== -1 || r.indexOf('poultry') !== -1 || r.indexOf('pork') !== -1) r.push('meat-with-dairy');
    return r;
  }

  // How one recipe works for one person: ok | caution | swap | no.
  function evaluateRecipe(recipe, rules) {
    var tags = recipeTags(recipe);
    var hard = tags.filter(function (t) { return rules.block[t]; });
    var soft = tags.filter(function (t) { return rules.caution[t]; });
    var ingredients = list(recipe.ingredients);
    var avoidHits = [], dislikeHits = [];
    rules.avoidIngredients.forEach(function (term) {
      ingredients.forEach(function (ing) { if (ingredientMatches(ing, term) && avoidHits.indexOf(ing) === -1) avoidHits.push(ing); });
    });
    rules.dislikes.forEach(function (term) {
      ingredients.forEach(function (ing) { if (ingredientMatches(ing, term) && dislikeHits.indexOf(ing) === -1) dislikeHits.push(ing); });
    });

    var remaining = hard.slice();
    var swaps = [];
    list(recipe.swaps).forEach(function (s) {
      var removes = swapRemoves(s);
      var helps = remaining.some(function (t) { return removes.indexOf(t) !== -1; });
      var safe = !list(s.adds).some(function (t) { return rules.block[t]; });
      if (helps && safe) {
        // Severe allergy: a per-plate swap risks cross-contact, so the whole dish changes.
        var severe = remaining.some(function (t) {
          return removes.indexOf(t) !== -1 && rules.block[t].some(function (why) { return /\(severe\)$/.test(why); });
        });
        swaps.push(severe ? 'Whole dish (severe allergy — avoid cross-contact): ' + s.text : s.text);
        remaining = remaining.filter(function (t) { return removes.indexOf(t) === -1; });
        soft = soft.filter(function (t) { return removes.indexOf(t) === -1; });
      }
    });
    // Optional swaps that ease a caution.
    var tips = [];
    list(recipe.swaps).forEach(function (s) {
      if (swaps.indexOf(s.text) !== -1) return;
      var removes = swapRemoves(s);
      var helps = soft.some(function (t) { return removes.indexOf(t) !== -1; });
      var safe = !list(s.adds).some(function (t) { return rules.block[t]; });
      if (helps && safe) tips.push(s.text);
    });

    var status;
    if (remaining.length || avoidHits.length) status = 'no';
    else if (swaps.length) status = 'swap';
    else if (soft.length || dislikeHits.length) status = 'caution';
    else status = 'ok';

    return {
      status: status,
      blockedBy: remaining.map(function (t) { return { tag: t, why: rules.block[t] }; }),
      avoidHits: avoidHits,
      swaps: swaps,
      cautions: soft.map(function (t) { return { tag: t, why: rules.caution[t] }; }),
      dislikes: dislikeHits,
      tips: tips
    };
  }

  // Small deterministic PRNG so a week's plan is stable until something changes.
  function seeded(seedStr) {
    var h = 2166136261;
    for (var i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () {
      h += 0x6D2B79F5;
      var t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var STATUS_WEIGHT = { ok: 1, caution: 0.45, swap: 0.6 };

  function familyFit(recipe, eaters) {
    var per = eaters.map(function (e) { return { member: e.member, result: evaluateRecipe(recipe, e.rules) }; });
    var noCount = per.filter(function (p) { return p.result.status === 'no'; }).length;
    var weight = per.reduce(function (w, p) {
      var severeSwap = p.result.swaps.some(function (s) { return s.indexOf('Whole dish') === 0; });
      return w * (STATUS_WEIGHT[p.result.status] || 0) * (severeSwap ? 0.3 : 1);
    }, 1);
    var worst = per.reduce(function (w, p) {
      var r = { ok: 0, caution: 1, swap: 2, no: 3 }[p.result.status];
      return Math.max(w, r);
    }, 0);
    return { recipe: recipe, per: per, noCount: noCount, weight: weight, worst: ['ok', 'caution', 'swap', 'no'][worst] };
  }

  /*
   * Builds a 7-day breakfast/lunch/dinner plan for the chosen eaters.
   * opts: { today, recipes, overrides: { 'dayIndex-meal': recipeId }, seed }
   */
  function buildPlan(members, opts) {
    opts = opts || {};
    var today = opts.today || new Date();
    var recipes = opts.recipes || KB.RECIPES;
    var overrides = opts.overrides || {};
    var ws = weekStart(today);
    var eaters = members.map(function (m) { return { member: m, rules: profileRules(m, today) }; });
    var rand = seeded(isoDate(ws) + '|' + (opts.seed || '') + '|' + members.map(function (m) { return m.id; }).join(','));
    var notices = [];

    var fits = {};
    recipes.forEach(function (r) { fits[r.id] = familyFit(r, eaters); });

    var days = DAYS.map(function (name, i) {
      var d = new Date(ws); d.setDate(ws.getDate() + i);
      return { name: name, date: isoDate(d), meals: {} };
    });

    MEALS.forEach(function (meal) {
      var pool = recipes.filter(function (r) { return r.meal === meal; }).map(function (r) { return fits[r.id]; });
      var safe = pool.filter(function (f) { return f.noCount === 0; });
      var used = {};

      days.forEach(function (day, i) {
        var key = i + '-' + meal;
        var chosen = null;

        if (overrides[key]) {
          var o = fits[overrides[key]];
          if (o && o.noCount === 0) chosen = o;
          else if (o) notices.push(day.name + ' ' + meal + ': "' + o.recipe.name + '" was replaced — it no longer works for ' + o.per.filter(function (p) { return p.result.status === 'no'; }).map(function (p) { return p.member.name; }).join(', ') + '.');
        }
        if (!chosen && safe.length) {
          var fresh = safe.filter(function (f) { return !used[f.recipe.id]; });
          var candidates = fresh.length ? fresh : safe;
          var total = candidates.reduce(function (s, f) { return s + f.weight; }, 0);
          var pick = rand() * total;
          for (var c = 0; c < candidates.length; c++) {
            pick -= candidates[c].weight;
            if (pick <= 0) { chosen = candidates[c]; break; }
          }
          if (!chosen) chosen = candidates[candidates.length - 1];
        }
        if (!chosen && pool.length) {
          // Nothing fits everyone: take the dish that leaves out the fewest people.
          chosen = pool.slice().sort(function (a, b) { return a.noCount - b.noCount || b.weight - a.weight; })[0];
        }
        if (chosen) used[chosen.recipe.id] = true;
        day.meals[meal] = chosen;
      });
    });

      .sort(function (x, y) { return picks[y.id].score - picks[x.id].score; }).slice(0, 8)
      .map(function (fd) { return { food: fd, why: picks[fd.id].reasons[0] }; });
    var entry = (m.daily || {})[key()] || {};
    return { m: m, g: g, a: a, day: day, w: w, top: top, labs: Labs.latestLabs(m), entry: entry, dayIdx: (today().getDay() + 6) % 7 };
  }

  // One dinner (or any slot) for the given people from the smart planner.
  function mealIdea(members, slot, seed) {
    var lib = Planner.library(state.customIngredients);
    var adults = members.filter(function (m) { var x = E.ageYears(m.birthdate, today()); return x === null || x >= 18; });
    var base = (adults.length ? adults : members).map(function (m) { return E.buildGuide(m, today()).targets; });
    var kcal = base.reduce(function (s, t) { return s + (t.kcal || 2000); }, 0) / base.length;
    var res = Planner.smartPlan({
      lib: lib, pantry: state.pantry, slots: [slot || 'dinner'], days: 1, seed: seed || key(), cuisine: (state.planner || {}).cuisine || 'any',
      targets: function (s) { return Foods.mealTargets(kcal, null, s); },
      eaters: members.map(function (m) {
        var pk = P.foodPicks(P.focus(m, E.ageYears(m.birthdate, today())));
        return { name: m.name, prefs: Object.assign({}, state.householdPrefs, m.foodPrefs || {}), pick: function (id) { return pk[id] ? pk[id].score : 0; }, blocked: function (fd) { return blocked(fd, m); } };
      })
    });
    var meal = res.days[0] && res.days[0].meals[0];
    if (meal) meal.foods = meal.items.map(function (it) { return Planner.byId(lib, it.foodId); });
    return meal;
  }

  function save() { if (!demo) Store.save(state); }

  function log(m, field, value) {
    m.daily = m.daily || {};
    m.daily[key()] = m.daily[key()] || {};
    m.daily[key()][field] = value;
    save();
  }

  function initials(name) { return String(name || '?').trim().charAt(0).toUpperCase(); }

  root.Dir = { state: state, demo: demo, person: person, mealIdea: mealIdea, log: log, save: save, esc: esc, initials: initials, blocked: blocked,
    E: E, Foods: Foods, P: P, DB: DB, W: W, Labs: Labs, KB: KB, Planner: Planner };
})(this);
</script>
  <script>
  (function () {
    'use strict';
    var D = window.Dir, esc = D.esc;
    var eating = D.state.members.map(function (m) { return m.id; });
    var reader = D.state.members[0].id, seed = 1;
    var COLORS = { breakfast: 'var(--saffron)', lunch: 'var(--olive)', dinner: 'var(--tomato)', snack: 'var(--plum)' };
    var LABEL = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snack: 'Snack' };
    var app = document.getElementById('app');

    function people() { return D.state.members.filter(function (m) { return eating.indexOf(m.id) !== -1; }); }

    function dish(slot, eaters) {
      var meal = D.mealIdea(eaters, slot, 'table' + seed + slot + eating.join(''));
      if (!meal) return '';
      var notes = eaters.map(function (m) {
        var g = D.E.buildGuide(m, new Date());
        var f = g.focus[0];
        return f ? '<div>' + f.icon + ' <strong>' + esc(m.name) + ':</strong> ' + esc(f.short) + '</div>' : '';
      }).join('');
      return '<article class="dish" style="--c:' + COLORS[slot] + '"><div class="slot">' + LABEL[slot] + '</div><h3>' + esc(meal.name) + '</h3>' +
        '<div class="emo">' + meal.foods.map(function (fd) { return fd.emoji; }).join('') + '</div>' +
        '<div class="meta">' + meal.totals.kcal + ' kcal · ' + meal.totals.protein + ' g protein · ' + meal.totals.fiber + ' g fiber · season with ' + esc(meal.flavor) + '</div>' +
        (notes ? '<div class="notes">' + notes + '</div>' : '') + '</article>';
    }

    function render() {
      var eaters = people();
      var r = D.state.members.filter(function (m) { return m.id === reader; })[0];
      var x = D.person(r), a = x.a;
      var dinner = eaters.length ? D.mealIdea(eaters, 'dinner', 'table' + seed + 'dinner' + eating.join('')) : null;
      var spots = [[50, 8], [80, 40], [50, 72], [14, 40], [30, 15]];
      var plate = dinner ? dinner.foods.map(function (fd, i) { var s = spots[i % spots.length]; return '<span class="food" style="left:' + s[0] + '%;top:' + s[1] + '%;transform:translate(-50%,0)">' + fd.emoji + '</span>'; }).join('') : '';
      var ALLERGY = ['peanut', 'treenut', 'milk', 'egg', 'wheat', 'soy', 'fish', 'shellfish', 'sesame', 'gluten'];
      var allergies = [];
      eaters.forEach(function (m) { Object.keys(D.E.profileRules(m, new Date()).block).filter(function (t) { return ALLERGY.indexOf(t) !== -1; }).forEach(function (t) { var l = (D.KB.TAG_LABELS[t] || t) + ' (' + m.name + ')'; if (allergies.indexOf(l) === -1) allergies.push(l); }); });
      var tips = { vegetables: 'Half the plate.', fruits: 'Whole beats juice.', meats: 'Fish twice a week.', plants: 'Beans count twice.', carbs: 'Make half whole grain.', fat: 'Olive oil over butter.', protein: 'Spread across meals.', fiber: 'Add slowly, with water.', dairy: 'Or fortified soy.' };
      var colors = ['var(--olive)', 'var(--tomato)', 'var(--plum)', 'var(--saffron)', 'var(--saffron)', 'var(--sea)', 'var(--tomato)', 'var(--olive)', 'var(--sea)'];

      app.innerHTML = '<div class="mast"><span class="name">Table</span><span class="issue">The family table · ' + new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) + '</span></div>' +
        '<div class="hero"><div><h1>Tonight: ' + (dinner ? esc(dinner.name.replace(/ (plate|bowl|skillet|salad|wrap)$/, '')) : 'set the table') + '</h1>' +
        '<p>' + (eaters.length ? 'Cooked once for ' + eaters.map(function (m) { return esc(m.name); }).join(', ') + ' — free of ' + (allergies.length ? esc(allergies.join(', ')) + ', and checked against everyone\'s diet and health.' : 'anything anyone can\'t eat.') : 'Choose who\'s at the table.') + '</p>' +
        '<div class="eaters">' + D.state.members.map(function (m) { return '<button class="eater' + (eating.indexOf(m.id) !== -1 ? ' on' : '') + '" data-eat="' + esc(m.id) + '">' + esc(m.name) + '</button>'; }).join('') + '</div>' +
        '<p style="margin-top:16px"><button class="btn" data-act="reroll">Another menu</button> <a class="btn ghost" href="Family-Health-Guide.html#/planner">Plan the week</a></p>' +
        (D.demo ? '<p class="demo">Starring the demo family — yours appears once added in the app.</p>' : '') + '</div>' +
        '<div class="plate">' + plate + '<div class="label">' + (dinner ? dinner.totals.kcal + ' kcal<br><span class="muted" style="font-size:.85rem">per adult plate</span>' : '') + '</div></div></div>' +
        '<div class="section-title"><h2>Today\'s menu</h2><span>Planned around everyone</span></div>' +
        '<div class="menu">' + (eaters.length ? ['breakfast', 'lunch', 'dinner'].map(function (s) { return dish(s, eaters); }).join('') : '') + '</div>' +
        '<div class="section-title"><h2>How much, for ' + esc(r.name) + '</h2><span>' + D.state.members.map(function (m) { return '<a href="#" data-read="' + esc(m.id) + '" style="color:inherit;margin-left:8px;' + (m.id === reader ? 'text-decoration:underline' : 'text-decoration:none') + '">' + esc(m.name) + '</a>'; }).join('') + '</span></div>' +
        (a.tooYoung || a.missing ? '<p class="muted">Little ones follow the pediatrician\'s feeding plan.</p>' : '<div class="spread">' + D.DB.CHAPTERS.map(function (ch, i) {
          return '<div class="stat" style="--c:' + colors[i] + '"><div class="em">' + ch.emoji + '</div><div class="amt">' + esc(ch.headline(a)) + '</div><div class="what">' + esc(ch.title.split(':')[0]) + '</div><div class="tip">' + esc(tips[ch.id] || '') + '</div></div>';
        }).join('') + (x.day.water && x.day.water.cups ? '<div class="stat" style="--c:var(--sea)"><div class="em">💧</div><div class="amt">' + x.day.water.cups + ' cups</div><div class="what">Water</div><div class="tip">' + x.day.water.liters + ' L from drinks.</div></div>' : '') + '</div>') +
        '<div class="cols"><div class="story">' + (x.g.focus[0] ? '<h3>' + x.g.focus[0].icon + ' ' + esc(x.g.focus[0].title) + '</h3><p class="drop">' + esc(x.g.focus[0].because) + '. ' + esc(x.g.focus[0].eatMore.join('. ')) + '. ' + esc(x.g.focus[0].tip) + '</p>' :
          '<h3>The good stuff</h3><p class="drop">' + esc(r.name) + '\'s latest results don\'t call for any changes — keep the plate colorful, half vegetables and fruit, and the grains whole.</p>') +
        (x.top.length ? '<h3>On ' + esc(r.name) + '\'s shelf</h3><div class="shelf">' + x.top.map(function (t) { return '<span class="jar' + (D.state.pantry[t.food.id] ? ' on' : '') + '" data-jar="' + esc(t.food.id) + '" title="' + esc(t.why) + '">' + t.food.emoji + ' ' + esc(t.food.name) + '</span>'; }).join('') + '</div><p class="muted" style="font-size:.85rem">Tap what\'s in the kitchen — the menu uses it first.</p>' : '') + '</div>' +
        '<div class="story side"><h3>Move</h3><p style="margin:0 0 8px">' + esc(x.w.summary) + '</p>' + (x.w.week[x.dayIdx] ? '<p><strong>Today:</strong> ' + esc(x.w.week[x.dayIdx].title) + '</p>' : '') +
        (x.day.steps ? '<p><strong>' + x.day.steps.goal.toLocaleString('en-US') + ' steps</strong> a day — ' + esc(x.day.steps.why[0]) + '</p>' : '') + '</div></div>';
    }

    document.addEventListener('click', function (ev) {
      var e = ev.target.closest('[data-eat]');
      if (e) { var id = e.getAttribute('data-eat'), i = eating.indexOf(id); if (i === -1) eating.push(id); else if (eating.length > 1) eating.splice(i, 1); render(); return; }
      var rd = ev.target.closest('[data-read]'); if (rd) { ev.preventDefault(); reader = rd.getAttribute('data-read'); render(); return; }
      var j = ev.target.closest('[data-jar]'); if (j) { var fid = j.getAttribute('data-jar'); if (D.state.pantry[fid]) delete D.state.pantry[fid]; else D.state.pantry[fid] = true; D.save(); render(); return; }
      if (ev.target.closest('[data-act="reroll"]')) { seed++; render(); }
    });
    render();
  })();
  </script>
</body>
