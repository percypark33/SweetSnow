<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table — the family food magazine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Karla:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf6ec; --paper: #fffdf8; --ink: #2b2118; --muted: #7a6a58; --line: #eadfcd;
      --tomato: #d9542b; --olive: #6b7a2a; --saffron: #e3a21a; --plum: #7d3c6b; --sea: #2f6f7e; --radius: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #1b1611; --paper: #241d16; --ink: #f4ead9; --muted: #bba98f; --line: #3a2f24; }
    }
    :root[data-theme="dark"] { --bg: #1b1611; --paper: #241d16; --ink: #f4ead9; --muted: #bba98f; --line: #3a2f24; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 Karla, -apple-system, system-ui, sans-serif; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 60px; }
    .mast { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding: 18px 0 10px; margin-bottom: 24px; }
    .mast .name { font: 800 1.8rem Fraunces, Georgia, serif; letter-spacing: -.02em; }
    .mast .issue { font-size: .8rem; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
    h1, h2, h3 { font-family: Fraunces, Georgia, serif; letter-spacing: -.01em; }
    .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; align-items: center; margin-bottom: 30px; }
    .hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.02; margin: 0 0 12px; font-weight: 800; }
    .hero p { color: var(--muted); font-size: 1.1rem; margin: 0; }
    .plate { aspect-ratio: 1; border-radius: 50%; background: var(--paper); border: 10px solid var(--line); position: relative; box-shadow: 0 20px 40px rgba(60,40,10,.12); display: grid; place-items: center; }
    .plate .food { position: absolute; font-size: 3.2rem; }
    .plate .label { font: 600 1rem Fraunces, serif; text-align: center; max-width: 60%; }
    .eaters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
    .eater { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: 600 .9rem Karla, sans-serif; cursor: pointer; }
    .eater.on { background: var(--ink); color: var(--bg); }
    .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 34px; }
    .dish { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; position: relative; overflow: hidden; }
    .dish::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--c); }
    .dish .slot { font-size: .75rem; text-transform: uppercase; letter-spacing: .16em; color: var(--c); font-weight: 600; }
    .dish h3 { font-size: 1.35rem; margin: 4px 0 8px; line-height: 1.15; }
    .dish .emo { font-size: 1.8rem; letter-spacing: 4px; }
    .dish .meta { font-size: .85rem; color: var(--muted); }
    .dish .notes { font-size: .85rem; margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
    .btn { padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); font: 600 .9rem Karla, sans-serif; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn.ghost { background: transparent; color: var(--ink); }
    .section-title { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--ink); padding-top: 10px; margin: 10px 0 16px; }
    .section-title h2 { margin: 0; font-size: 1.7rem; }
    .section-title span { font-size: .8rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
    .spread { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--paper); margin-bottom: 34px; }
    .stat { padding: 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .stat .em { font-size: 1.8rem; }
    .stat .amt { font: 800 1.6rem Fraunces, serif; line-height: 1.1; margin: 6px 0 2px; color: var(--c); }
    .stat .what { font-weight: 600; }
    .stat .tip { font-size: .85rem; color: var(--muted); margin-top: 6px; }
    .cols { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .story { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
    .story h3 { font-size: 1.4rem; margin: 0 0 6px; }
    .story .drop::first-letter { font: 800 3.2rem/0.8 Fraunces, serif; float: left; margin: 6px 8px 0 0; color: var(--tomato); }
    .shelf { display: flex; flex-wrap: wrap; gap: 6px; }
    .jar { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-size: .85rem; cursor: pointer; color: var(--ink); font-family: inherit; }
    .jar.on { background: var(--olive); border-color: var(--olive); color: #fff; }
    .side h3 { font-size: 1.2rem; margin: 0 0 8px; }
    .side ul { padding-left: 18px; margin: 0; font-size: .92rem; }
    .muted { color: var(--muted); }
    .demo { font-size: .8rem; color: var(--muted); font-style: italic; }
    @media (max-width: 820px) { .hero, .cols { grid-template-columns: 1fr; } .plate { width: min(300px, 80vw); margin: 0 auto; } .plate .food { font-size: 2.4rem; } .section-title { flex-wrap: wrap; gap: 4px 12px; } }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script src="../js/knowledge.js"></script>
  <script src="../js/labs.js"></script>
  <script src="../js/foods.js"></script>
  <script src="../js/personal.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/dietbook.js"></script>
  <script src="../js/workout.js"></script>
  <script src="../js/planner.js"></script>
  <script src="../js/store.js"></script>
  <script src="../sample/demo-family.js"></script>
  <script src="shared.js"></script>
  <script>
  (function () {
    'use strict';
    var D = window.Dir, esc = D.esc;
    var eating = D.state.members.map(function (m) { return m.id; });
    var reader = D.state.members[0].id, seed = 1;
    var COLORS = { breakfast: 'var(--saffron)', lunch: 'var(--olive)', dinner: 'var(--tomato)', snack: 'var(--plum)' };
    var LABEL = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snack: 'Snack' };
    var app = document.getElementById('app');

    function people() { return D.state.members.filter(function (m) { return eating.indexOf(m.id) !== -1; }); }

    function dish(slot, eaters) {
      var meal = D.mealIdea(eaters, slot, 'table' + seed + slot + eating.join(''));
      if (!meal) return '';
      var notes = eaters.map(function (m) {
        var g = D.E.buildGuide(m, new Date());
        var f = g.focus[0];
        return f ? '<div>' + f.icon + ' <strong>' + esc(m.name) + ':</strong> ' + esc(f.short) + '</div>' : '';
      }).join('');
      return '<article class="dish" style="--c:' + COLORS[slot] + '"><div class="slot">' + LABEL[slot] + '</div><h3>' + esc(meal.name) + '</h3>' +
        '<div class="emo">' + meal.foods.map(function (fd) { return fd.emoji; }).join('') + '</div>' +
        '<div class="meta">' + meal.totals.kcal + ' kcal · ' + meal.totals.protein + ' g protein · ' + meal.totals.fiber + ' g fiber · season with ' + esc(meal.flavor) + '</div>' +
        (notes ? '<div class="notes">' + notes + '</div>' : '') + '</article>';
    }

    function render() {
      var eaters = people();
      var r = D.state.members.filter(function (m) { return m.id === reader; })[0];
      var x = D.person(r), a = x.a;
      var dinner = eaters.length ? D.mealIdea(eaters, 'dinner', 'table' + seed + 'dinner' + eating.join('')) : null;
      var spots = [[50, 8], [80, 40], [50, 72], [14, 40], [30, 15]];
      var plate = dinner ? dinner.foods.map(function (fd, i) { var s = spots[i % spots.length]; return '<span class="food" style="left:' + s[0] + '%;top:' + s[1] + '%;transform:translate(-50%,0)">' + fd.emoji + '</span>'; }).join('') : '';
      var ALLERGY = ['peanut', 'treenut', 'milk', 'egg', 'wheat', 'soy', 'fish', 'shellfish', 'sesame', 'gluten'];
      var allergies = [];
      eaters.forEach(function (m) { Object.keys(D.E.profileRules(m, new Date()).block).filter(function (t) { return ALLERGY.indexOf(t) !== -1; }).forEach(function (t) { var l = (D.KB.TAG_LABELS[t] || t) + ' (' + m.name + ')'; if (allergies.indexOf(l) === -1) allergies.push(l); }); });
      var tips = { vegetables: 'Half the plate.', fruits: 'Whole beats juice.', meats: 'Fish twice a week.', plants: 'Beans count twice.', carbs: 'Make half whole grain.', fat: 'Olive oil over butter.', protein: 'Spread across meals.', fiber: 'Add slowly, with water.', dairy: 'Or fortified soy.' };
      var colors = ['var(--olive)', 'var(--tomato)', 'var(--plum)', 'var(--saffron)', 'var(--saffron)', 'var(--sea)', 'var(--tomato)', 'var(--olive)', 'var(--sea)'];

      app.innerHTML = '<div class="mast"><span class="name">Table</span><span class="issue">The family table · ' + new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) + '</span></div>' +
        '<div class="hero"><div><h1>Tonight: ' + (dinner ? esc(dinner.name.replace(/ (plate|bowl|skillet|salad|wrap)$/, '')) : 'set the table') + '</h1>' +
        '<p>' + (eaters.length ? 'Cooked once for ' + eaters.map(function (m) { return esc(m.name); }).join(', ') + ' — free of ' + (allergies.length ? esc(allergies.join(', ')) + ', and checked against everyone\'s diet and health.' : 'anything anyone can\'t eat.') : 'Choose who\'s at the table.') + '</p>' +
        '<div class="eaters">' + D.state.members.map(function (m) { return '<button class="eater' + (eating.indexOf(m.id) !== -1 ? ' on' : '') + '" data-eat="' + esc(m.id) + '">' + esc(m.name) + '</button>'; }).join('') + '</div>' +
        '<p style="margin-top:16px"><button class="btn" data-act="reroll">Another menu</button> <a class="btn ghost" href="../index.html#/planner">Plan the week</a></p>' +
        (D.demo ? '<p class="demo">Starring the demo family — yours appears once added in the app.</p>' : '') + '</div>' +
        '<div class="plate">' + plate + '<div class="label">' + (dinner ? dinner.totals.kcal + ' kcal<br><span class="muted" style="font-size:.85rem">per adult plate</span>' : '') + '</div></div></div>' +
        '<div class="section-title"><h2>Today\'s menu</h2><span>Planned around everyone</span></div>' +
        '<div class="menu">' + (eaters.length ? ['breakfast', 'lunch', 'dinner'].map(function (s) { return dish(s, eaters); }).join('') : '') + '</div>' +
        '<div class="section-title"><h2>How much, for ' + esc(r.name) + '</h2><span>' + D.state.members.map(function (m) { return '<a href="#" data-read="' + esc(m.id) + '" style="color:inherit;margin-left:8px;' + (m.id === reader ? 'text-decoration:underline' : 'text-decoration:none') + '">' + esc(m.name) + '</a>'; }).join('') + '</span></div>' +
        (a.tooYoung || a.missing ? '<p class="muted">Little ones follow the pediatrician\'s feeding plan.</p>' : '<div class="spread">' + D.DB.CHAPTERS.map(function (ch, i) {
          return '<div class="stat" style="--c:' + colors[i] + '"><div class="em">' + ch.emoji + '</div><div class="amt">' + esc(ch.headline(a)) + '</div><div class="what">' + esc(ch.title.split(':')[0]) + '</div><div class="tip">' + esc(tips[ch.id] || '') + '</div></div>';
        }).join('') + (x.day.water && x.day.water.cups ? '<div class="stat" style="--c:var(--sea)"><div class="em">💧</div><div class="amt">' + x.day.water.cups + ' cups</div><div class="what">Water</div><div class="tip">' + x.day.water.liters + ' L from drinks.</div></div>' : '') + '</div>') +
        '<div class="cols"><div class="story">' + (x.g.focus[0] ? '<h3>' + x.g.focus[0].icon + ' ' + esc(x.g.focus[0].title) + '</h3><p class="drop">' + esc(x.g.focus[0].because) + '. ' + esc(x.g.focus[0].eatMore.join('. ')) + '. ' + esc(x.g.focus[0].tip) + '</p>' :
          '<h3>The good stuff</h3><p class="drop">' + esc(r.name) + '\'s latest results don\'t call for any changes — keep the plate colorful, half vegetables and fruit, and the grains whole.</p>') +
        (x.top.length ? '<h3>On ' + esc(r.name) + '\'s shelf</h3><div class="shelf">' + x.top.map(function (t) { return '<span class="jar' + (D.state.pantry[t.food.id] ? ' on' : '') + '" data-jar="' + esc(t.food.id) + '" title="' + esc(t.why) + '">' + t.food.emoji + ' ' + esc(t.food.name) + '</span>'; }).join('') + '</div><p class="muted" style="font-size:.85rem">Tap what\'s in the kitchen — the menu uses it first.</p>' : '') + '</div>' +
        '<div class="story side"><h3>Move</h3><p style="margin:0 0 8px">' + esc(x.w.summary) + '</p>' + (x.w.week[x.dayIdx] ? '<p><strong>Today:</strong> ' + esc(x.w.week[x.dayIdx].title) + '</p>' : '') +
        (x.day.steps ? '<p><strong>' + x.day.steps.goal.toLocaleString('en-US') + ' steps</strong> a day — ' + esc(x.day.steps.why[0]) + '</p>' : '') + '</div></div>';
    }

    document.addEventListener('click', function (ev) {
      var e = ev.target.closest('[data-eat]');
      if (e) { var id = e.getAttribute('data-eat'), i = eating.indexOf(id); if (i === -1) eating.push(id); else if (eating.length > 1) eating.splice(i, 1); render(); return; }
      var rd = ev.target.closest('[data-read]'); if (rd) { ev.preventDefault(); reader = rd.getAttribute('data-read'); render(); return; }
      var j = ev.target.closest('[data-jar]'); if (j) { var fid = j.getAttribute('data-jar'); if (D.state.pantry[fid]) delete D.state.pantry[fid]; else D.state.pantry[fid] = true; D.save(); render(); return; }
      if (ev.target.closest('[data-act="reroll"]')) { seed++; render(); }
    });
    render();
  })();
  </script>
</body>
</html>
