<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pulse — daily coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d10; --panel: #15181d; --panel-2: #1d2128; --line: #2a2f38; --text: #f1f3f5; --muted: #8b93a1;
      --water: #4cc3ff; --steps: #b6f36a; --move: #ff7a59; --focus: #c58bff; --radius: 22px;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) { --bg: #eef0f3; --panel: #ffffff; --panel-2: #f3f4f7; --line: #dfe2e7; --text: #12151a; --muted: #5d6573; --steps: #5fae1c; --water: #0d8fd6; }
    }
    :root[data-theme="light"] { --bg: #eef0f3; --panel: #ffffff; --panel-2: #f3f4f7; --line: #dfe2e7; --text: #12151a; --muted: #5d6573; --steps: #5fae1c; --water: #0d8fd6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 "Space Grotesk", -apple-system, system-ui, sans-serif; }
    .phone { max-width: 440px; margin: 0 auto; min-height: 100vh; padding: 18px 16px 96px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .hello { font-size: .85rem; color: var(--muted); }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; }
    .people { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; }
    .avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel-2); color: var(--text); font: 700 1.05rem inherit; cursor: pointer; }
    .avatar.on { border-color: var(--steps); box-shadow: 0 0 0 3px color-mix(in srgb, var(--steps) 25%, transparent); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .rings { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
    .rings svg { width: 150px; height: 150px; }
    .rings circle { fill: none; stroke-width: 12; stroke-linecap: round; }
    .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .stat:last-child { border: 0; }
    .stat b { font-size: 1.15rem; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .quick { display: flex; gap: 8px; margin-top: 12px; }
    .quick button, .btn { flex: 1; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: 600 .95rem inherit; cursor: pointer; }
    .quick button:active { transform: scale(.98); }
    .kicker { font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin-bottom: 6px; }
    .big { font-size: 1.25rem; font-weight: 700; margin: 0 0 4px; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .list { margin: 8px 0 0; padding: 0; list-style: none; }
    .list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: .92rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { padding: 6px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: .82rem; }
    .focus { border-color: color-mix(in srgb, var(--focus) 45%, var(--line)); }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
    .wd { text-align: center; padding: 8px 0; border-radius: 12px; background: var(--panel-2); font-size: .72rem; color: var(--muted); }
    .wd b { display: block; color: var(--text); font-size: .9rem; }
    .wd.strength { background: color-mix(in srgb, var(--move) 22%, var(--panel-2)); }
    .wd.cardio, .wd.walk, .wd.vigorous { background: color-mix(in srgb, var(--water) 20%, var(--panel-2)); }
    .wd.today { outline: 2px solid var(--steps); }
    .bars { display: grid; gap: 10px; margin-top: 6px; }
    .bar-top { display: flex; justify-content: space-between; font-size: .9rem; }
    .meter { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
    .meter span { display: block; height: 100%; border-radius: 99px; }
    nav.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; width: min(408px, calc(100% - 32px)); display: grid; grid-template-columns: repeat(4, 1fr); background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; padding: 6px; }
    nav.tabbar button { background: none; border: 0; color: var(--muted); font: 600 .75rem inherit; padding: 8px 0; border-radius: 16px; cursor: pointer; display: grid; gap: 2px; justify-items: center; }
    nav.tabbar button span { font-size: 1.2rem; }
    nav.tabbar button.on { color: var(--text); background: var(--panel-2); }
    .demo { font-size: .75rem; color: var(--muted); text-align: center; margin: 4px 0 10px; }
    a { color: var(--water); }
  </style>
</head>
<body>
  <div class="phone" id="app"></div>
  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today" class="on"><span>◎</span>Today</button>
    <button data-tab="eat"><span>🍽</span>Eat</button>
    <button data-tab="move"><span>⚡</span>Move</button>
    <button data-tab="me"><span>☺</span>Me</button>
  </nav>

  <script src="../js/knowledge.js"></script>
  <script src="../js/labs.js"></script>
  <script src="../js/foods.js"></script>
  <script src="../js/personal.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/dietbook.js"></script>
  <script src="../js/workout.js"></script>
  <script src="../js/planner.js"></script>
  <script src="../js/store.js"></script>
  <script src="../sample/demo-family.js"></script>
  <script src="shared.js"></script>
  <script>
  (function () {
    'use strict';
    var D = window.Dir, esc = D.esc;
    var tab = 'today', who = D.state.members[0].id, seed = 1;
    var app = document.getElementById('app');

    function ring(r, pct, color) {
      var c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct || 0));
      return '<circle cx="75" cy="75" r="' + r + '" stroke="var(--panel-2)"/><circle cx="75" cy="75" r="' + r + '" stroke="' + color + '" stroke-dasharray="' + (p * c) + ' ' + c + '" transform="rotate(-90 75 75)"/>';
    }

    function today(x) {
      var water = x.entry.water || 0, steps = x.entry.steps || 0, moved = !!x.entry.moved;
      var wGoal = x.day.water && x.day.water.cups, sGoal = x.day.steps && x.day.steps.goal;
      var session = x.w.week[x.dayIdx];
      var meal = D.mealIdea([x.m], 'dinner', 'pulse' + seed + x.m.id);
      var f = x.g.focus[0];
      return '<div class="card"><div class="rings"><svg viewBox="0 0 150 150" role="img" aria-label="Today\'s rings">' +
        ring(64, wGoal ? water / wGoal : 0, 'var(--water)') + ring(48, sGoal ? steps / sGoal : 0, 'var(--steps)') + ring(32, moved ? 1 : 0, 'var(--move)') + '</svg>' +
        '<div>' + (wGoal ? '<div class="stat"><span><i class="dot" style="background:var(--water)"></i>Water</span><b>' + water + '/' + wGoal + '</b></div>' : '') +
        (sGoal ? '<div class="stat"><span><i class="dot" style="background:var(--steps)"></i>Steps</span><b>' + (steps / 1000).toFixed(1) + 'k/' + (sGoal / 1000) + 'k</b></div>' : '') +
        '<div class="stat"><span><i class="dot" style="background:var(--move)"></i>Workout</span><b>' + (moved ? 'Done' : session && session.type !== 'rest' ? 'To do' : 'Rest') + '</b></div></div></div>' +
        '<div class="quick">' + (wGoal ? '<button data-act="water">+ 💧 cup</button>' : '') + (sGoal ? '<button data-act="steps">+ 1k steps</button>' : '') + '<button data-act="moved">' + (moved ? '↺ Undo' : '✓ Workout') + '</button></div></div>' +
        (session ? '<div class="card"><div class="kicker">Today\'s training · ' + esc(session.day) + '</div><p class="big">' + esc(session.title) + '</p><div class="muted small">' + (session.minutes ? session.minutes + ' min' : 'Recovery') + '</div>' +
          (session.items.length ? '<ul class="list">' + session.items.map(function (i) { return '<li><span>' + esc(i.name) + '</span><span class="muted">' + (i.sets ? i.sets + '×' + esc(i.reps) : '') + '</span></li>'; }).join('') + '</ul>' : '') + '</div>' : '') +
        (meal ? '<div class="card"><div class="kicker">Dinner idea</div><p class="big">' + esc(meal.name) + '</p><div class="muted small">' + meal.totals.kcal + ' kcal · ' + meal.totals.protein + ' g protein · ' + meal.totals.fiber + ' g fiber</div>' +
          '<div class="chips">' + meal.foods.map(function (fd) { return '<span class="chip">' + fd.emoji + ' ' + esc(fd.name) + '</span>'; }).join('') + '</div><div class="quick"><button data-act="reroll">↻ Another idea</button></div></div>' : '') +
        (f ? '<div class="card focus"><div class="kicker">Your focus</div><p class="big">' + f.icon + ' ' + esc(f.title) + '</p><div class="muted small">' + esc(f.because) + '</div><p class="small">' + esc(f.tip) + '</p></div>' : '');
    }

    function eat(x) {
      var a = x.a;
      if (a.tooYoung || a.missing) return '<div class="card">Food amounts for under-2s come from the pediatrician.</div>';
      var rows = D.DB.CHAPTERS.map(function (ch) { return '<li><span>' + ch.emoji + ' ' + esc(ch.title.split(':')[0]) + '</span><b>' + esc(ch.headline(a)) + '</b></li>'; }).join('');
      return '<div class="card"><div class="kicker">Daily fuel · ' + a.kcal.toLocaleString('en-US') + ' kcal</div><div class="bars">' +
        [['Protein', a.protein.min, 'g', 'var(--move)'], ['Carbs', a.carbs.min + '–' + a.carbs.max, 'g', 'var(--steps)'], ['Fat', a.fat.min + '–' + a.fat.max, 'g', 'var(--water)'], ['Fiber', a.fiber.grams, 'g', 'var(--focus)']].map(function (b) {
          return '<div><div class="bar-top"><span>' + b[0] + '</span><b>' + b[1] + ' ' + b[2] + '</b></div><div class="meter"><span style="width:100%;background:' + b[3] + '"></span></div></div>';
        }).join('') + '</div></div>' +
        (x.top.length ? '<div class="card"><div class="kicker">⭐ Picked for ' + esc(x.m.name) + '</div><ul class="list">' + x.top.map(function (t) { return '<li><span>' + t.food.emoji + ' ' + esc(t.food.name) + '</span><span class="muted small">' + esc(t.why.replace(/^\S+ /, '')) + '</span></li>'; }).join('') + '</ul></div>' : '') +
        '<div class="card"><div class="kicker">The diet book</div><ul class="list">' + rows + '</ul></div>';
    }

    function move(x) {
      var w = x.w;
      return '<div class="card"><div class="kicker">' + esc(w.focus || 'Activity') + '</div><p class="big">' + esc(w.splitName || 'Daily active play') + '</p><p class="muted small">' + esc(w.summary) + '</p>' +
        (w.week.length ? '<div class="week">' + w.week.map(function (d, i) { return '<div class="wd ' + d.type + (i === x.dayIdx ? ' today' : '') + '"><b>' + d.day.charAt(0) + '</b>' + (d.minutes || '–') + '</div>'; }).join('') + '</div>' : '') + '</div>' +
        w.week.filter(function (d) { return d.items.length; }).slice(0, 3).map(function (d) {
          return '<div class="card"><div class="kicker">' + d.day + '</div><p class="big">' + esc(d.title) + '</p><ul class="list">' + d.items.map(function (i) { return '<li><span>' + esc(i.name) + '</span><span class="muted">' + (i.sets ? i.sets + '×' + esc(i.reps) : '') + '</span></li>'; }).join('') + '</ul></div>';
        }).join('') + (w.cautions.length ? '<div class="card focus">' + w.cautions.map(function (c) { return '<p class="small">⚠️ ' + esc(c) + '</p>'; }).join('') + '</div>' : '');
    }

    function me(x) {
      var labs = Object.keys(x.labs).map(function (id) { var d = D.Labs.labDef(id); return '<li><span>' + esc(d.label) + '</span><b>' + x.labs[id].value + ' <span class="muted small">' + esc(d.unit) + '</span></b></li>'; }).join('');
      return '<div class="card"><div class="kicker">Profile</div><p class="big">' + esc(x.m.name) + '</p><div class="muted small">' + [x.g.age !== null ? x.g.age + ' yrs' : '', x.m.sex, x.m.bloodType ? 'Blood ' + x.m.bloodType : ''].filter(Boolean).join(' · ') + '</div>' +
        '<div class="chips">' + Object.keys(x.g.rules.block).map(function (t) { return '<span class="chip">🚫 ' + esc(D.KB.TAG_LABELS[t] || t) + '</span>'; }).join('') + '</div></div>' +
        (x.g.focus.length ? '<div class="card focus"><div class="kicker">Built around you</div><ul class="list">' + x.g.focus.map(function (r) { return '<li><span>' + r.icon + ' ' + esc(r.title) + '</span><span class="muted small">' + (r.lab ? 'blood test' : 'health') + '</span></li>'; }).join('') + '</ul></div>' : '') +
        (labs ? '<div class="card"><div class="kicker">Latest blood work</div><ul class="list">' + labs + '</ul></div>' : '') +
        '<p class="small muted" style="text-align:center"><a href="../index.html#/member/' + esc(x.m.id) + '">Open the full app →</a></p>';
    }

    function render() {
      var m = D.state.members.filter(function (p) { return p.id === who; })[0] || D.state.members[0];
      var x = D.person(m);
      var hour = new Date().getHours();
      app.innerHTML = '<header><div><div class="hello">' + (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') + '</div><h1>' + esc(m.name) + '</h1></div><div class="muted small">' + new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + '</div></header>' +
        (D.demo ? '<div class="demo">Demo family — add your own in the main app</div>' : '') +
        '<div class="people">' + D.state.members.map(function (p) { return '<button class="avatar' + (p.id === m.id ? ' on' : '') + '" data-who="' + esc(p.id) + '" aria-label="' + esc(p.name) + '">' + esc(D.initials(p.name)) + '</button>'; }).join('') + '</div>' +
        ({ today: today, eat: eat, move: move, me: me }[tab])(x);
      document.querySelectorAll('nav.tabbar button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
    }

    document.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-tab]'); if (t) { tab = t.getAttribute('data-tab'); render(); window.scrollTo(0, 0); return; }
      var w = ev.target.closest('[data-who]'); if (w) { who = w.getAttribute('data-who'); render(); return; }
      var a = ev.target.closest('[data-act]'); if (!a) return;
      var m = D.state.members.filter(function (p) { return p.id === who; })[0];
      var e = (m.daily || {})[D.E.isoDate(new Date())] || {};
      var act = a.getAttribute('data-act');
      if (act === 'water') D.log(m, 'water', (e.water || 0) + 1);
      else if (act === 'steps') D.log(m, 'steps', (e.steps || 0) + 1000);
      else if (act === 'moved') D.log(m, 'moved', !e.moved);
      else if (act === 'reroll') seed++;
      render();
    });
    render();
  })();
  </script>
</body>
</html>
